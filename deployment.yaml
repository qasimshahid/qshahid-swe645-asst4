apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythonsurvey-deployment
  labels:
    app: pythonsurvey
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pythonsurvey
  template:
    metadata:
      labels:
        app: pythonsurvey
    spec:
      containers:
      - name: pythonsurvey
        image: qshahid/pythonsurvey:latest
        ports:
        - containerPort: 8080