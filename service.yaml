# service.yaml: Kubernetes service configuration for exposing the Python Survey application.
apiVersion: v1
kind: Service
metadata:
  name: pythonsurvey-service
  labels:
    app: pythonsurvey
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30008
  selector:
    app: pythonsurvey